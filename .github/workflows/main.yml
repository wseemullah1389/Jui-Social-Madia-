
name: Build JUI Social Media APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'jui-social-madia.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q jui-social-media-apk-package.zip -d source
          find source -name gradlew -type f -exec chmod +x {} \;
      - name: Create debug keystore
        run: |
          mkdir -p source/jui_package
          keytool -genkeypair -v \
            -keystore source/jui_package/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: |
          cd source
          PROJECT_DIR=$(find . -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUI-Social-Media-APK
          path: source/**/build/outputs/apk/debug/*.apk
